services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: copilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - copilot_pg:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      retries: 10
volumes:
  copilot_pg:
